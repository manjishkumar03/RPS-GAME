<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Demo</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header>ROCK PAPER AND SCISSOR</header>
    <div class="game-logo">
        <div class="choice" id="rock"></div>
        <div class="choice" id="paper"></div>
        <div class="choice" id="scissor"></div>
    </div>

    <div class="score-board">
        <div class="score">
            <p class="user-score">0</p>
            <p>YOU</p>            
        </div>

        <div class="score">
            <p class="conputer-score">0</p>
            <p>COMPUTER</p>            
        </div>
    </div>

    <div class="result-board">
        <p id="result">play Your Move</p>
    </div>


    <script src="script.js"></script>
</body>
</html>
